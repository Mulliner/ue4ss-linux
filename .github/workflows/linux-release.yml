name: Linux Release Publisher

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v3.0.1-linux)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Publish Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libegl-dev libgles-dev \
            gcc g++ binutils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Configure CMake (Linux Development)
        run: |
          export CC=gcc
          export CXX=g++
          cmake -B build_linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Game__Dev__Linux64 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUE4SS_GUI_ENABLED=ON \
            -DUE4SS_INPUT_ENABLED=OFF \
            -DUE4SS_PROFILERS=OFF \
            -Wno-dev

      - name: Build UE4SS (Development)
        run: |
          cmake --build build_linux --target UE4SS --verbose

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous release tag (sorted by version, excluding current tag)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${{ inputs.tag_name }}" | head -1)
          
          echo "Previous tag: ${PREV_TAG:-none}"
          
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD" --no-merges 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s" -50 --no-merges 2>/dev/null || echo "")
          fi
          
          # Build changelog in a temp file
          CHANGELOG_FILE=$(mktemp)
          
          # Categorize commits and write to temp file
          FEATURES_FILE=$(mktemp)
          FIXES_FILE=$(mktemp)
          REFACTORS_FILE=$(mktemp)
          OTHER_FILE=$(mktemp)
          
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            lower=$(echo "$line" | tr '[:upper:]' '[:lower:]')
            if echo "$lower" | grep -qE '^(feat|feature|add|implement)'; then
              echo "- ${line}" >> "$FEATURES_FILE"
            elif echo "$lower" | grep -qE '^(fix|bugfix|hotfix)'; then
              echo "- ${line}" >> "$FIXES_FILE"
            elif echo "$lower" | grep -qE '^(refactor|cleanup|optim|perf)'; then
              echo "- ${line}" >> "$REFACTORS_FILE"
            else
              echo "- ${line}" >> "$OTHER_FILE"
            fi
          done <<< "$COMMITS"
          
          # Assemble changelog
          {
            if [ -s "$FEATURES_FILE" ]; then
              echo "### ✨ Features / Neue Funktionen"
              cat "$FEATURES_FILE"
              echo ""
            fi
            if [ -s "$FIXES_FILE" ]; then
              echo "### 🐛 Bug Fixes"
              cat "$FIXES_FILE"
              echo ""
            fi
            if [ -s "$REFACTORS_FILE" ]; then
              echo "### 🔧 Refactoring & Optimierung"
              cat "$REFACTORS_FILE"
              echo ""
            fi
            if [ -s "$OTHER_FILE" ]; then
              echo "### 📝 Sonstige Änderungen"
              cat "$OTHER_FILE"
              echo ""
            fi
            if [ ! -s "$FEATURES_FILE" ] && [ ! -s "$FIXES_FILE" ] && [ ! -s "$REFACTORS_FILE" ] && [ ! -s "$OTHER_FILE" ]; then
              echo "Keine Änderungen seit dem letzten Release."
              echo ""
            fi
            echo "---"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...${{ inputs.tag_name }}"
            echo "**Vollständige Commit-Historie:** [${PREV_TAG:-initial}...${{ inputs.tag_name }}](${COMPARE_URL})"
          } > "$CHANGELOG_FILE"
          
          # Write to GITHUB_OUTPUT using heredoc
          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            cat "$CHANGELOG_FILE"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          
          # Cleanup
          rm -f "$FEATURES_FILE" "$FIXES_FILE" "$REFACTORS_FILE" "$OTHER_FILE" "$CHANGELOG_FILE"
          
      - name: Strip and prepare artifacts
        run: |
          mkdir -p release
          # Find the built .so file
          SO_FILE=$(find build_linux -name "libUE4SS.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: libUE4SS.so not found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          ls -lh "$SO_FILE"
          # Strip debug symbols
          cp "$SO_FILE" release/libUE4SS.so
          strip --strip-debug release/libUE4SS.so
          ls -lh release/libUE4SS.so
          # Generate build info
          cat > release/BUILD_INFO.txt << EOF
          UE4SS Linux Native Build
          ========================
          Tag: ${{ inputs.tag_name }}
          Commit: $(git rev-parse HEAD)
          Branch: $(git branch --show-current)
          Build Type: Game__Dev__Linux64
          Compiler: $(gcc --version | head -1)
          Build Host: ubuntu-24.04 (x86_64)
          GUI: Enabled (GLFW3/OpenGL3)
          Input: Disabled
          Profilers: Disabled
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: release/
          retention-days: 1
          overwrite: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: linux-native
          body: |
            ## UE4SS ${{ inputs.tag_name }} — Linux Native Build
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### Build-Konfiguration
            - Build Type: Game__Dev__Linux64
            - GUI: Enabled (GLFW3/OpenGL3)
            - Input: Disabled
            - Profilers: Disabled
            - Compiler: GCC (Ubuntu 24.04)
            
            ### Artefakte
            - `libUE4SS.so` — Stripped shared library
            - `BUILD_INFO.txt` — Build metadata
            
            ### Verwendung
            ```bash
            LD_PRELOAD=./libUE4SS.so ./YourGameBinary
            ```
            
            ### Kompatibilität
            - Built on Ubuntu 24.04 (x86_64)
            - Requires: libGL, libEGL, libX11, libXrandr, libXinerama, libXcursor, libXi
            - Engine Tick Hook: Auto-detected via dlsym (or manual override in UE4SS_Addresses.ini)
          files: |
            release/libUE4SS.so
            release/BUILD_INFO.txt
