name: Linux Release

on:
  push:
    branches:
      - linux-native
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: XarminaEu/ue4ss-linux-releases

jobs:
  build-and-release:
    name: Build and Release libUE4SS.so
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ libfmt-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure CMake (Linux Native)
        run: |
          cmake -B build_linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Game__Shipping__Linux64 \
            -DUE4SS_GUI_ENABLED=OFF \
            -DUE4SS_INPUT_ENABLED=OFF \
            -DUE4SS_PROFILERS=OFF

      - name: Build UE4SS
        run: |
          cmake --build build_linux --target UE4SS

      - name: Package build
        run: |
          mkdir -p release
          cp build_linux/Game__Shipping__Linux64/lib/libUE4SS.so release/
          cd release && zip -r ../UE4SS-Linux-build.zip libUE4SS.so

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          path: releases-repo
          token: ${{ secrets.RELEASES_PAT }}

      - name: Sync README and CHANGELOG to releases repo
        run: |
          cp README.md releases-repo/README.md
          cp CHANGELOG.md releases-repo/CHANGELOG.md
          cd releases-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md CHANGELOG.md
          git diff --staged --quiet || git commit -m "Update README and CHANGELOG"
          git push

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          gh release list --repo ${{ env.RELEASES_REPO }} --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Deleting release with tag: $tag"
            gh release delete "$tag" --repo ${{ env.RELEASES_REPO }} --yes --cleanup-tag
          done

      - name: Create new release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y-%m-%d')
          TAG="v${DATE}-${SHORT_SHA}"
          CHANGELOG=$(awk '/^## /{found=1} found{print} /^---/{if(found)exit}' CHANGELOG.md | head -50)
          gh release create "$TAG" \
            --repo ${{ env.RELEASES_REPO }} \
            --title "UE4SS Linux Build - ${DATE}" \
            --notes "${CHANGELOG}" \
            UE4SS-Linux-build.zip
          RELEASE_URL=$(gh release view "$TAG" --repo ${{ env.RELEASES_REPO }} --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_date=$DATE" >> $GITHUB_OUTPUT

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RELEASE_URL="${{ steps.create_release.outputs.release_url }}"
          RELEASE_TAG="${{ steps.create_release.outputs.release_tag }}"
          RELEASE_DATE="${{ steps.create_release.outputs.release_date }}"
          CHANGELOG=$(awk '/^## /{found=1} found{print} /^---/{if(found)exit}' CHANGELOG.md | head -40)
          PAYLOAD=$(jq -n \
            --arg url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg date "$RELEASE_DATE" \
            --arg changelog "$CHANGELOG" \
            '{
              embeds: [{
                title: ("UE4SS Linux Build Released — " + $tag),
                description: $changelog,
                color: 5814783,
                fields: [
                  {name: "Download", value: $url, inline: false}
                ],
                footer: {text: ("Build date: " + $date)},
                timestamp: (now | todateiso8601)
              }]
            }')
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
